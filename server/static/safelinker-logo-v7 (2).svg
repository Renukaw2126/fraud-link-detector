<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3234aa"/>
      <stop offset="100%" style="stop-color:#0d6efd"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3234aa"/>
      <stop offset="100%" style="stop-color:#0d6efd"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3234aa" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="35" cy="35" r="30" fill="none" stroke="url(#grad)" stroke-width="3"/>

  <!-- Inner filled circle -->
  <circle cx="35" cy="35" r="20" fill="url(#grad)"/>

  <!-- Shield inside circle -->
  <path d="M27 24 L43 24 L43 36 Q43 44 35 48 Q27 44 27 36 Z"
        fill="white" opacity="0.95"/>

  <!-- Tick inside shield -->
  <polyline points="30,34 34,39 41,27"
            fill="none" stroke="url(#grad)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dotted arc on top of circle -->
  <circle cx="35" cy="6" r="2" fill="#0d6efd" opacity="0.5"/>
  <circle cx="55" cy="13" r="1.5" fill="#0d6efd" opacity="0.35"/>
  <circle cx="62" cy="30" r="1" fill="#0d6efd" opacity="0.2"/>

  <!-- SAFE bold -->
  <text x="76" y="32"
        font-family="Arial Black, sans-serif"
        font-size="26" font-weight="900"
        fill="white" letter-spacing="2">SAFE</text>

  <!-- LINKER thin -->
  <text x="76" y="54"
        font-family="Arial, sans-serif"
        font-size="20" font-weight="300"
        fill="white" letter-spacing="5">LINKER</text>

  <!-- Right side vertical accent -->
  <rect x="165" y="14" width="3" height="28" rx="2" fill="white" opacity="0.8"/>

  <!-- Tagline -->
  <text x="184" y="32"
        font-family="Arial, sans-serif"
        font-size="11" fill="rgba(255,255,255,0.6)" letter-spacing="1.5">POWERED BY</text>
  <text x="184" y="48"
        font-family="Arial, sans-serif"
        font-size="11" fill="white" letter-spacing="1.5" font-weight="700">MACHINE LEARNING</text>

</svg>
